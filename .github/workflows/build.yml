name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: 6.10.3

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            qt_arch: linux_gcc_64
            artifact_glob: build/ShowroomPlayer
          - os: macos
            runner: macos-26
            qt_arch: clang_64
            artifact_glob: build/Release/ShowroomPlayer.app
          - os: windows
            runner: windows-2025-vs2026
            qt_arch: win64_msvc2022_64
            artifact_glob: build/Release/ShowroomPlayer.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev \
            ffmpeg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: 'qtmultimedia qtwebsockets'
          cache: true

      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            cmake -S . -B build -G "Visual Studio 18 2026" -A x64
          else
            cmake -S . -B build -G "Ninja Multi-Config" \
              -DCMAKE_CONFIGURATION_TYPES=${{ env.BUILD_TYPE }}
          fi

      - name: Build
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Install (deploy)
        run: |
          cmake --install build --config ${{ env.BUILD_TYPE }} --prefix "${{ github.workspace }}/dist"

      - name: Package macOS app
        if: matrix.os == 'macos'
        # actions/upload-artifact's internal zipper does NOT preserve the
        # symlinks Qt frameworks rely on (Versions/Current, top-level Foo,
        # Resources). When the user extracts via Archive Utility or Keka those
        # symlinks become real copies, the framework's Versions/A/_CodeSignature
        # seal no longer matches the duplicated content, and macOS AMFI kills
        # the app at launch with "Invalid Page". ditto's zip mode preserves
        # symlinks, so we pre-zip with ditto and upload that zip instead.
        run: |
          set -euo pipefail
          mkdir -p staging
          cp -RP build/Release/ShowroomPlayer.app staging/
          xattr -cr staging/ShowroomPlayer.app
          (cd staging && ditto -c -k --keepParent ShowroomPlayer.app ShowroomPlayer-macos.zip)
          ls -la staging/ShowroomPlayer-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowroomPlayer-${{ matrix.os }}
          path: |
            ${{ matrix.os != 'macos' && matrix.artifact_glob || '' }}
            ${{ matrix.os != 'macos' && 'dist/' || '' }}
            staging/ShowroomPlayer-macos.zip
          if-no-files-found: error
