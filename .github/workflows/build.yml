name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: 6.10.3

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            qt_arch: linux_gcc_64
            preset_prefix: Linux
            artifact_glob: build/ShowroomPlayer
          - os: macos
            runner: macos-26
            qt_arch: clang_64
            preset_prefix: Macos
            artifact_glob: build/ShowroomPlayer.app
          - os: windows
            runner: windows-2025-vs2026
            qt_arch: win64_msvc2022_64
            preset_prefix: Windows
            artifact_glob: build/Release/ShowroomPlayer.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Conan and Ninja
        run: |
          python -m pip install --upgrade pip
          pip install "conan>=2.5" ninja

      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libssl-dev \
            ffmpeg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: 'qtmultimedia qtwebsockets'
          cache: true

      - name: Conan install
        run: conan install . --build=missing -s build_type=${{ env.BUILD_TYPE }}

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.preset_prefix }}${{ env.BUILD_TYPE }}

      - name: Build
        run: |
          cmake --build --preset ${{ matrix.preset_prefix }}${{ env.BUILD_TYPE }} --config ${{ env.BUILD_TYPE }}

      - name: Install (deploy)
        run: |
          cmake --install build --config ${{ env.BUILD_TYPE }} --prefix dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowroomPlayer-${{ matrix.os }}
          path: |
            ${{ matrix.artifact_glob }}
            dist/
          if-no-files-found: error
